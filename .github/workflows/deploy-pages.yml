name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate deploy configuration
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: CF_API_TOKEN"
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Missing GitHub Actions secret: ANTHROPIC_API_KEY"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Publish to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
        run: |
          # Cloudflare Pages project is named "caras-partner" (not caras-partner-website),
          # and its configured Production branch is "main" — this repo's default branch is
          # "master", so we deploy explicitly to "main" regardless of GITHUB_REF_NAME,
          # otherwise the deploy lands as a Preview build and caraspartner.com never updates.
          # The ANTHROPIC_API_KEY and CLAUDE_MODEL are provided from repo secrets.
          wrangler pages deploy . --project-name caras-partner --branch main
